services:
  db:
    image: postgres:15-alpine
    container_name: postgres_final
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: teste
    ports:
      - "5433:5432"
    volumes:
      - pgdata_final:/var/lib/postgresql/data

volumes:
  pgdata_final:
